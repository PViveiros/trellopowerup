<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Escolher Prioridade</title>
  <link rel="stylesheet" href="../css/popup.css">
  <script src="https://p.trellocdn.com/power-up.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <button class="red" data-priority="Urgent">Urgent</button>
  <button class="orange" data-priority="Important">Important</button>
  <button class="yellow" data-priority="Medium">Medium</button>
  <button class="green" data-priority="Low">Low</button>

  <script src="../js/popup.js"></script>
</body>
</html>
