<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Prioridade</title>
  <link rel="stylesheet" href="../css/popup.css">
  <script src="https://p.trellocdn.com/power-up.min.js" crossorigin="anonymous"></script>
</head>
<body>

  <div class="dropdown">
    <div class="item" data-priority="Urgent">
      <span class="dot red"></span>
      Urgent
      <span class="check">✔</span>
    </div>

    <div class="item" data-priority="Important">
      <span class="dot orange"></span>
      Important
      <span class="check">✔</span>
    </div>

    <div class="item" data-priority="Medium">
      <span class="dot yellow"></span>
      Medium
      <span class="check">✔</span>
    </div>

    <div class="item" data-priority="Low">
      <span class="dot green"></span>
      Low
      <span class="check">✔</span>
    </div>

    <div class="divider"></div>

    <div class="item clear" data-priority="Sem prioridade">
      <span class="dot gray"></span>
      Sem prioridade
    </div>
  </div>

  <script src="../js/popup.js"></script>
</body>
</html>
